name: Build Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build screens
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: ""
          CI: "false"
        run: |
          npx --yes yarn install --frozen-lockfile
          npx --yes yarn build
      - name: Build McCoyTrucking.exe
        working-directory: backend
        run: |
          python -m pip install -r requirements-desktop.txt pyinstaller
          python -m PyInstaller --noconfirm --onefile --windowed --name McCoyTrucking `
            --add-data "..\frontend\build;frontend_build" `
            --add-data "telemetry_bridge.py;." `
            --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: McCoyTrucking-Windows
          path: backend/dist/McCoyTrucking.exe
